name: Inspect CRI template detail

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - .github/workflows/inspect-cri-template-detail.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Print exact template cells
        run: |
          node --input-type=module <<'NODE'
          import ExcelJS from 'exceljs';
          import fs from 'node:fs';
          const wb = new ExcelJS.Workbook();
          await wb.xlsx.load(fs.readFileSync('public/cri_blo_template.xlsx'));

          function printable(value) {
            if (value == null) return '';
            if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value).trim();
            if (value instanceof Date) return value.toISOString();
            if (typeof value === 'object') {
              if (typeof value.text === 'string') return value.text.trim();
              if (Array.isArray(value.richText)) return value.richText.map(x => x?.text ?? '').join('').trim();
              if (value.result != null) return String(value.result).trim();
            }
            return '';
          }

          const fiche = wb.getWorksheet('FICHE SAV BLO');
          console.log('=== FICHE SAV BLO rows 24-55 ===');
          for (let r = 24; r <= 55; r++) {
            const hits = [];
            for (let c = 1; c <= 12; c++) {
              const cell = fiche.getCell(r, c);
              const text = printable(cell.value);
              if (text) hits.push(`${cell.address}=${JSON.stringify(text)}`);
            }
            if (hits.length) console.log(hits.join(' | '));
          }

          for (const sheetName of ['PHOTOS OI','MESURES','RDSUR','PHOTOS OC','PLAN']) {
            const ws = wb.getWorksheet(sheetName);
            if (!ws) continue;
            console.log(`=== ${sheetName} text ===`);
            for (let r = 1; r <= Math.min(ws.rowCount, 80); r++) {
              const hits = [];
              for (let c = 1; c <= Math.min(ws.columnCount || 12, 12); c++) {
                const cell = ws.getCell(r,c);
                const text = printable(cell.value);
                if (text) hits.push(`${cell.address}=${JSON.stringify(text)}`);
              }
              if (hits.length) console.log(hits.join(' | '));
            }
          }
          NODE
