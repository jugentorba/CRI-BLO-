name: Apply isolated N/A choice UI patch

on:
  push:
    branches:
      - criblo-master-spec-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch RIP free-text visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/cri.$id.tsx')
          s = p.read_text()
          old = '{f.freeTextLabel && selected && ('
          new = '{f.freeTextLabel && selected === "RIP" && ('
          if old not in s:
              raise SystemExit('expected choice condition not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Remove helper and commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-choice-na.yml
          git add 'src/routes/cri.$id.tsx'
          git commit -m "Hide RIP name field when N/A is selected"
          git push origin HEAD:criblo-master-spec-v1
