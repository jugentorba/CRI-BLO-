name: Patch iOS browser v6

on:
  push:
    paths:
      - '.github/workflows/patch-ios-browser-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0
      - name: Apply browser v6 patch
        run: python3 scripts/patch-ios-browser-v6.py
      - name: Commit browser v6
        shell: bash
        run: |
          rm .github/workflows/patch-ios-browser-v6.yml scripts/patch-ios-browser-v6.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift scripts/patch-ios-info.mjs .github/workflows/patch-ios-browser-v6.yml scripts/patch-ios-browser-v6.py
          git commit -m 'Make iOS GeoReseaux hold adaptive and add Face ID autofill'
          git push origin HEAD:criblo-master-spec-v1
