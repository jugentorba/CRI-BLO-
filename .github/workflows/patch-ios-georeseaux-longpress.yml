name: Patch iOS GeoReseaux long press

on:
  push:
    paths:
      - '.github/workflows/patch-ios-georeseaux-longpress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0
      - name: Apply long-press patch
        run: python3 .github/scripts/patch_ios_georeseaux_longpress.py
      - name: Commit patch and remove helpers
        run: |
          rm .github/scripts/patch_ios_georeseaux_longpress.py
          rm .github/workflows/patch-ios-georeseaux-longpress.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Strengthen iOS GeoReseaux long-press bridge'
          git push origin HEAD:criblo-master-spec-v1
