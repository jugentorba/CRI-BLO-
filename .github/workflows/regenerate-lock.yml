name: Regenerate public npm lockfile

on:
  push:
    branches:
      - criblo-master-spec-v1

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Regenerate lockfile from public npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git commit -m "Regenerate package lock from public npm"
          git push origin HEAD:criblo-master-spec-v1
