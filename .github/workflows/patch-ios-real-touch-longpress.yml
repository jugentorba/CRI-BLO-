name: Patch iOS real touch long press

on:
  push:
    paths:
      - '.github/workflows/patch-ios-real-touch-longpress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patch-ios-real-touch-longpress.py
      - name: Commit patch
        run: |
          rm .github/workflows/patch-ios-real-touch-longpress.yml
          rm .github/patch-ios-real-touch-longpress.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift .github/workflows/patch-ios-real-touch-longpress.yml .github/patch-ios-real-touch-longpress.py
          git commit -m 'Use real iOS touch target for GeoReseaux long press'
          git push origin HEAD:criblo-master-spec-v1
