name: Apply GeoReseaux exact Android tail

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - scripts/patch-georeseaux-exact-android-tail.mjs
      - .github/workflows/apply-georeseaux-exact-android-tail.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: criblo-master-spec-v1

jobs:
  patch-test-build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Apply exact Android lifecycle patch
        run: |
          set -euxo pipefail
          node scripts/patch-georeseaux-exact-android-tail.mjs
          git diff --check

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Lint source
        run: npm run lint

      - name: Test real-iPhone to Android lifecycle
        run: npm run test:ios-longpress-bridge

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Apply CRI-BLO iOS privacy permissions
        run: node scripts/patch-ios-info.mjs

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios-device-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package and verify unsigned IPA
        run: |
          rm -rf Payload CRI-BLO-iOS-exact-android-tail.ipa
          mkdir -p Payload
          cp -R ios-device-build/Build/Products/Debug-iphoneos/App.app Payload/App.app
          zip -qry CRI-BLO-iOS-exact-android-tail.ipa Payload
          unzip -t CRI-BLO-iOS-exact-android-tail.ipa
          unzip -l CRI-BLO-iOS-exact-android-tail.ipa | grep -F 'Payload/App.app/Info.plist'

      - name: Commit validated source only
        run: |
          set -euxo pipefail
          rm -f scripts/patch-georeseaux-exact-android-tail.mjs
          rm -f .github/workflows/apply-georeseaux-exact-android-tail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift scripts/test-ios-longpress-bridge.mjs scripts/patch-georeseaux-exact-android-tail.mjs .github/workflows/apply-georeseaux-exact-android-tail.yml
          git diff --cached --check
          git commit -m "Rebuild GeoReseaux Android mouse lifecycle on iOS"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Upload validated IPA
        uses: actions/upload-artifact@v4
        with:
          name: CRI-BLO-iOS-exact-android-tail
          path: CRI-BLO-iOS-exact-android-tail.ipa
          if-no-files-found: error
