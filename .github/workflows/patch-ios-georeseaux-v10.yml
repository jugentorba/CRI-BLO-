name: Patch iOS GeoReseaux v10

on:
  push:
    branches:
      - criblo-master-spec-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0
      - name: Apply single-contextmenu Android sequence
        shell: python
        run: |
          import base64
          exec(base64.b64decode(" "))
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          git diff --cached --check
          git commit -m "Send one Android-style GeoReseaux contextmenu on iOS"
          git push origin HEAD:criblo-master-spec-v1
