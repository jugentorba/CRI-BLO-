name: Patch iOS GeoReseaux v11

on:
  push:
    branches:
      - criblo-master-spec-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0

      - name: Restore native WebKit context interaction and trace trusted contextmenu
        shell: python
        run: |
          from pathlib import Path
          p = Path('plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift')
          s = p.read_text()

          old = '''\n    @available(iOS 13.0, *)\n    func webView(\n        _ webView: WKWebView,\n        contextMenuConfigurationForElement elementInfo: WKContextMenuElementInfo,\n        completionHandler: @escaping (UIContextMenuConfiguration?) -> Void\n    ) {\n        completionHandler(nil)\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit('WK context menu suppressor mismatch')
          s = s.replace(old, '\n', 1)

          old = "        syntheticPointerDowns: 0,\n        contextDispatches: 0\n      };"
          new = "        syntheticPointerDowns: 0,\n        contextDispatches: 0,\n        trustedContextmenus: 0,\n        trustedContextPrevented: false\n      };"
          if s.count(old) != 1:
              raise SystemExit('diagnostic counters mismatch')
          s = s.replace(old, new, 1)

          marker = """      document.addEventListener('touchstart', function (event) {"""
          inject = """      document.addEventListener('contextmenu', function (event) {\n        try {\n          if (!event || !event.isTrusted) return;\n          __cribloGeoDiag.trustedContextmenus++;\n          __cribloGeoDiag.lastResult = 'trusted-contextmenu';\n          clearRealTouchTimer();\n          setTimeout(function () {\n            try { __cribloGeoDiag.trustedContextPrevented = !!event.defaultPrevented; } catch (_) {}\n          }, 0);\n        } catch (_) {}\n      }, true);\n\n      document.addEventListener('touchstart', function (event) {"""
          if s.count(marker) != 1:
              raise SystemExit('touchstart insertion marker mismatch')
          s = s.replace(marker, inject, 1)

          old = "          realTouchTimer = setTimeout(fireRealTouchLongPress, 600);"
          new = "          // Give native WebKit first chance to emit its own trusted contextmenu.\n          // Android does so at ~600ms; fallback only after that window.\n          realTouchTimer = setTimeout(fireRealTouchLongPress, 850);"
          if s.count(old) != 1:
              raise SystemExit('fallback timer mismatch')
          s = s.replace(old, new, 1)

          old = "          'Synthetic pointerdowns: ' + __cribloGeoDiag.syntheticPointerDowns,\n          'Event properties read: ' + (Object.keys(__cribloGeoDiag.eventProperties).sort().join(', ') || 'none'),"
          new = "          'Synthetic pointerdowns: ' + __cribloGeoDiag.syntheticPointerDowns,\n          'Trusted contextmenus: ' + __cribloGeoDiag.trustedContextmenus,\n          'Trusted context prevented: ' + String(!!__cribloGeoDiag.trustedContextPrevented),\n          'Event properties read: ' + (Object.keys(__cribloGeoDiag.eventProperties).sort().join(', ') || 'none'),"
          if s.count(old) != 1:
              raise SystemExit('diagnostic output mismatch')
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          git diff --cached --check
          git commit -m "Let WebKit emit trusted GeoReseaux contextmenu"
          git push origin HEAD:criblo-master-spec-v1
