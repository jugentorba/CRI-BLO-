name: Validate browser-level GeoReseaux Android ordering
# Validation checkpoint: test the committed application source only; never patch here.

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
      - scripts/test-ios-longpress-bridge.mjs
      - scripts/test-ios-georeseaux-ua-parity.mjs
      - .github/workflows/validate-georeso-browser-order.yml
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Require measured Android lifecycle
        run: npm run test:ios-longpress-bridge
      - name: Require Orange HTTP/JS Android identity parity
        run: npm run test:ios-georeseaux-ua-parity

  openlayers-browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ol: ['6.15.1', '7.2.2', '10.6.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare production bridge fixture
        env:
          OL_VERSION: ${{ matrix.ol }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/geo-final && cd /tmp/geo-final
          npm init -y >/dev/null
          npm install --no-audit --no-fund "ol@${OL_VERSION}" vite@5 playwright-core@1.55.0
          node - "$GITHUB_WORKSPACE" <<'NODE'
          const fs=require('fs'); const path=require('path'); const root=process.argv[2];
          const swift=fs.readFileSync(path.join(root,'plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift'),'utf8');
          const m=swift.match(/private static let longPressBridgeScript = #\"\"\"([\s\S]*?)\"\"\"#/); if(!m) throw new Error('bridge missing');
          fs.writeFileSync('/tmp/geo-final/bridge.js',m[1]);
          NODE
          cat > index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>
          html,body{margin:0;width:100%;height:100%;touch-action:none}#map{position:absolute;left:20px;top:20px;width:600px;height:400px;touch-action:none}.geo-popup{position:absolute;left:200px;top:150px;width:220px;height:90px;background:white;border:1px solid black;z-index:9999}
          </style></head><body><div id="map"></div><script>window.__cribloGeoReseauxAndroidCompat=true;</script><script src="/bridge.js"></script><script type="module" src="/main.js"></script></body></html>
          HTML
          cat > main.js <<'JS'
          import Map from 'ol/Map.js'; import View from 'ol/View.js';
          const map=new Map({target:'map',layers:[],view:new View({center:[0,0],zoom:2})});
          const viewport=map.getViewport(); window.__events=[]; window.__contextCalls=0;
          for(const type of ['pointerdown','touchstart','mousedown','touchend','pointerup','mouseup','click','contextmenu']) viewport.addEventListener(type,e=>window.__events.push(type+(e.isTrusted?'*':'')));
          viewport.addEventListener('contextmenu',e=>{window.__contextCalls++;e.preventDefault();const p=document.createElement('div');p.className='geo-popup';p.textContent='GEORESEAUX_POPUP_OPEN';document.body.appendChild(p);});
          window.__ready=true;
          JS
      - name: Real touch must expose measured Android order and open popup
        run: |
          set -euxo pipefail
          cd /tmp/geo-final
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          npx vite --host 127.0.0.1 --port 4178 >/tmp/geo-final-vite.log 2>&1 & SERVER=$!
          trap 'kill $SERVER || true; cat /tmp/geo-final-vite.log || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4178/ >/dev/null && break; sleep .25; done
          cat > verify.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:800,height:600},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 Chrome/139.0.0.0 Mobile Safari/537.36'});
            const page=await context.newPage(); const cdp=await context.newCDPSession(page);
            await page.goto('http://127.0.0.1:4178/',{waitUntil:'networkidle'}); await page.waitForFunction(()=>window.__ready===true);
            const x=260,y=180;
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y,radiusX:4,radiusY:4,force:1,id:1}]});
            await new Promise(r=>setTimeout(r,720));
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            await page.waitForFunction(()=>document.querySelector('.geo-popup')?.textContent==='GEORESEAUX_POPUP_OPEN',null,{timeout:2500});
            await new Promise(r=>setTimeout(r,100));
            const r=await page.evaluate(()=>({events:window.__events.slice(),contextCalls:window.__contextCalls,diag:window.__cribloGeoDiagnosticsText()}));
            console.log(JSON.stringify(r));
            const wanted=['touchstart','pointerdown','mousedown','touchend','pointerup','mouseup','click','contextmenu'];
            const clean=r.events.map(x=>x.replace(/\*$/,'')); const first=[];
            for(const name of clean){if(wanted.includes(name)&&!first.includes(name))first.push(name);}
            if(first.join(',')!==wanted.join(',')) throw new Error('not measured Android order: '+r.events.join(' > '));
            for(const type of ['touchstart','pointerdown','touchend','pointerup']) if(!r.events.includes(type+'*')) throw new Error('trusted '+type+' missing: '+r.events.join(' > '));
            if(r.contextCalls!==1) throw new Error('DOM popup handler calls='+r.contextCalls);
            if(!/Context events: 1 \/ observed: 1/.test(r.diag)) throw new Error('context dispatch count mismatch\n'+r.diag);
            if(!/OpenLayers direct: 0/.test(r.diag)) throw new Error('DOM-first path was bypassed\n'+r.diag);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME_PATH="$CHROME" node verify.cjs

  ios-build:
    needs: [regression, openlayers-browser]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - run: node scripts/patch-ios-info.mjs
      - name: Build iOS simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/ios-device-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
