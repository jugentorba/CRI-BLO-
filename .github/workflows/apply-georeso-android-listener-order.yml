name: Validate measured Android event order for GeoReseaux

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - scripts/patch-georeso-android-listener-order.mjs
      - .github/workflows/apply-georeso-android-listener-order.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: criblo-master-spec-v1

jobs:
  patch:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.out.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply measured Android listener-order conversion
        run: |
          set -euxo pipefail
          node scripts/patch-georeso-android-listener-order.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift scripts/test-ios-longpress-bridge.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo "Expected listener-order source diff is missing"; exit 1; }
          git commit -m "Present measured Android touch order to GeoReseaux"
          git push origin HEAD:${TARGET_BRANCH}
      - id: out
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  regression:
    needs: patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - name: Require exact measured Android page-visible lifecycle
        run: npm run test:ios-longpress-bridge
      - name: Keep HTTP/JS Android identity parity
        run: npm run test:ios-georeseaux-ua-parity

  real-browser-order:
    needs: patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare hidden OpenLayers fixture using production bridge
        run: |
          set -euxo pipefail
          mkdir -p /tmp/geo-order
          cd /tmp/geo-order
          npm init -y >/dev/null
          npm install --no-audit --no-fund ol@7.2.2 vite@5 playwright-core@1.55.0
          node - "$GITHUB_WORKSPACE" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.argv[2];
          const swift = fs.readFileSync(path.join(root, 'plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift'), 'utf8');
          const match = swift.match(/private static let longPressBridgeScript = #\"\"\"([\s\S]*?)\"\"\"#/);
          if (!match) throw new Error('bridge not found');
          fs.writeFileSync('/tmp/geo-order/bridge.js', match[1]);
          NODE
          cat > index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>
          html,body{margin:0;width:100%;height:100%;touch-action:none}#map{position:absolute;left:20px;top:20px;width:600px;height:400px;touch-action:none}.popup{position:absolute;left:200px;top:150px;width:180px;height:80px;background:white;border:1px solid black;z-index:999}
          </style></head><body><div id="map"></div><script>window.__cribloGeoReseauxAndroidCompat=true;</script><script src="/bridge.js"></script><script type="module" src="/main.js"></script></body></html>
          HTML
          cat > main.js <<'JS'
          import Map from 'ol/Map.js'; import View from 'ol/View.js';
          const map = new Map({target:'map', layers:[], view:new View({center:[0,0],zoom:2})});
          const viewport=map.getViewport(); window.__events=[];
          for(const type of ['pointerdown','touchstart','mousedown','touchend','pointerup','mouseup','click','contextmenu']) viewport.addEventListener(type,e=>window.__events.push(type+(e.isTrusted?'*':'')));
          viewport.addEventListener('contextmenu',e=>{e.preventDefault();const p=document.createElement('div');p.className='popup';p.textContent='OPEN';document.body.appendChild(p);});
          window.__ready=true;
          JS
      - name: Drive genuine browser touch and verify application-visible Android order
        run: |
          set -euxo pipefail
          cd /tmp/geo-order
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          npx vite --host 127.0.0.1 --port 4176 >/tmp/geo-order-vite.log 2>&1 & SERVER=$!
          trap 'kill $SERVER || true; cat /tmp/geo-order-vite.log || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4176/ >/dev/null && break; sleep .25; done
          cat > verify.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:800,height:600},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 Chrome/139.0.0.0 Mobile Safari/537.36'});
            const page=await context.newPage(); const cdp=await context.newCDPSession(page);
            await page.goto('http://127.0.0.1:4176/',{waitUntil:'networkidle'}); await page.waitForFunction(()=>window.__ready===true);
            const x=260,y=180;
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y,radiusX:4,radiusY:4,force:1,id:1}]});
            await new Promise(r=>setTimeout(r,720));
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            await page.waitForFunction(()=>document.querySelector('.popup')?.textContent==='OPEN',null,{timeout:2500});
            await new Promise(r=>setTimeout(r,80));
            const result=await page.evaluate(()=>({events:window.__events.slice(),diag:window.__cribloGeoDiagnosticsText()}));
            console.log(JSON.stringify(result));
            const clean=result.events.map(x=>x.replace(/\*$/,''));
            const wanted=['touchstart','pointerdown','mousedown','touchend','pointerup','mouseup','click','contextmenu'];
            const first=[]; for(const name of clean){if(wanted.includes(name)&&!first.includes(name))first.push(name);}
            if(first.join(',')!==wanted.join(',')) throw new Error('page-visible order is not measured Android order: '+result.events.join(' > '));
            if(result.events[0] !== 'touchstart*' || result.events[1] !== 'pointerdown*') throw new Error('trusted start order mismatch: '+result.events.join(' > '));
            if(!result.events.includes('touchend*') || !result.events.includes('pointerup*')) throw new Error('trusted release pair missing: '+result.events.join(' > '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME_PATH="$CHROME" node verify.cjs

  ios-build:
    needs: [patch, regression, real-browser-order]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - run: node scripts/patch-ios-info.mjs
      - name: Build simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/ios-device-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
