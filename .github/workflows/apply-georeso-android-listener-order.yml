name: Apply GeoReseaux pointer safety patch

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - .github/workflows/apply-georeso-android-listener-order.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add standalone pointer escape hatch
        run: |
          set -euxo pipefail
          node scripts/patch-georeso-pointer-escape-hatch.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          git diff --cached --check
          git diff --cached --quiet && { echo "Expected pointer safety diff is missing"; exit 1; }
          git commit -m "Preserve standalone pointer events in GeoReseaux"
          git pull --rebase origin criblo-master-spec-v1
          git push origin HEAD:criblo-master-spec-v1
