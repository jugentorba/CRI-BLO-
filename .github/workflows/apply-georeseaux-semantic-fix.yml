name: Apply GeoReseaux semantic long-press fix

on:
  push:
    branches:
      - fix/georeseaux-ios-semantic-longpress
    paths:
      - .github/workflows/apply-georeseaux-semantic-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/georeseaux-ios-semantic-longpress
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply semantic OpenLayers adapter
        run: python3 scripts/apply-ios-semantic-fix.py
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ios-longpress-bridge
      - run: npm run test:ios-georeseaux-ua-parity
      - name: Commit tested production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          git diff --cached --quiet && exit 0
          git commit -m "fix: deliver iOS GeoReseaux hold directly to OpenLayers"
          git push origin HEAD:fix/georeseaux-ios-semantic-longpress
