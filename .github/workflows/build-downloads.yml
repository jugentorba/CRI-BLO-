name: Build CRI-BLO Downloads

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-downloads:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      VITE_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - name: Checkout CRI-BLO source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund

      - name: Prepare Capacitor Android wrapper
        working-directory: source
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/core@8.5.0 @capacitor/android@8.5.0 @capacitor/cli@8.5.0 @capacitor/geolocation@8.2.2
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.criblo.app",
            "appName": "CRI BLO",
            "webDir": "dist"
          }
          JSON

      - name: Build PWA
        working-directory: source
        run: npm run build

      - name: Package PWA
        run: |
          mkdir -p output
          cd source
          zip -qr ../output/CRI-BLO-PWA.zip dist

      - name: Create Android project
        working-directory: source
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android-updater.mjs

      - name: Build Android APK
        working-directory: source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp source/android/app/build/outputs/apk/debug/app-debug.apk output/CRI-BLO-TEST-DEBUG.apk

      - name: Upload CRI-BLO files
        uses: actions/upload-artifact@v4
        with:
          name: CRI-BLO-debug-test
          path: |
            output/CRI-BLO-TEST-DEBUG.apk
            output/CRI-BLO-PWA.zip
          if-no-files-found: error
          retention-days: 30
