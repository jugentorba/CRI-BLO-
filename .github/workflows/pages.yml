name: Publish CRI-BLO PWA

on:
  push:
    branches:
      - main
    paths-ignore:
      - "downloads/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CRI-BLO source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund

      - name: Set PWA version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_NAME="0.1.${RUN_NUMBER}"
          echo "VITE_CRI_BLO_VERSION=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "CRI BLO PWA ${VERSION_NAME}"

      - name: Build PWA
        working-directory: source
        run: npm run build

      - name: Add GitHub Pages SPA fallback
        run: cp source/dist/index.html source/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
