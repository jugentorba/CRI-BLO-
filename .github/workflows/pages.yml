name: Publish CRI-BLO PWA + APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "downloads/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CRI-BLO source
        uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund

      - name: Set build version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((10000 + RUN_NUMBER))
          VERSION_NAME="0.1.${RUN_NUMBER}"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VITE_CRI_BLO_VERSION=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "CRI BLO ${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Build PWA
        working-directory: source
        run: npm run build

      - name: Add GitHub Pages SPA fallback
        run: cp source/dist/index.html source/dist/404.html

      - name: Package downloadable PWA
        run: |
          cd source
          zip -qr ../CRI-BLO-PWA.zip dist

      - name: Create Android project
        working-directory: source
        run: |
          npx cap add android
          npx cap sync android

      - name: Enable camera and GPS permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("source/android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              "    <uses-permission android:name=\"android.permission.CAMERA\" />",
              "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />",
              "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />",
          ]
          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              text = text.replace("<application", "\n".join(permissions) + "\n\n    <application", 1)
          if "android:usesCleartextTraffic=" not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          manifest.write_text(text)
          PY

      - name: Set Android app version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          gradle = Path("source/android/app/build.gradle")
          text = gradle.read_text()
          text = re.sub(r"versionCode\s+\d+", f"versionCode {os.environ['VERSION_CODE']}", text)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "{os.environ["VERSION_NAME"]}"', text)
          gradle.write_text(text)
          PY

      - name: Build Android APK
        working-directory: source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Add APK and PWA download files
        run: |
          mkdir -p source/dist/downloads
          cp source/android/app/build/outputs/apk/debug/app-debug.apk source/dist/downloads/CRI-BLO.apk
          cp CRI-BLO-PWA.zip source/dist/downloads/CRI-BLO-PWA.zip

      - name: Publish GitHub Release for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          APK="source/dist/downloads/CRI-BLO.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target criblo-master-spec-v1 \
              --title "CRI BLO ${VERSION_NAME}" \
              --notes "CRI BLO Android update containing the latest fixes, including supplementary photos embedded only in the Excel PHOTOS OI sheet."
          fi

      - name: Checkout download branch target
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish

      - name: Publish download files to repository
        run: |
          mkdir -p publish/downloads
          cp source/dist/downloads/CRI-BLO.apk publish/downloads/CRI-BLO.apk
          cp source/dist/downloads/CRI-BLO-PWA.zip publish/downloads/CRI-BLO-PWA.zip
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/CRI-BLO.apk downloads/CRI-BLO-PWA.zip
          if ! git diff --cached --quiet; then
            git commit -m "build: publish CRI-BLO APK and PWA downloads"
            git push origin main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
