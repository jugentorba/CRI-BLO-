name: Publish CRI-BLO PWA

on:
  push:
    branches:
      - main
    paths-ignore:
      - "downloads/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      VITE_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - name: Checkout CRI-BLO source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund

      - name: Build PWA
        working-directory: source
        run: npm run build

      - name: Add GitHub Pages SPA fallback
        run: cp source/dist/index.html source/dist/404.html

      - name: Package downloadable PWA
        run: |
          cd source
          zip -qr ../CRI-BLO-PWA.zip dist

      - name: Add PWA download
        run: |
          mkdir -p source/dist/downloads
          cp CRI-BLO-PWA.zip source/dist/downloads/CRI-BLO-PWA.zip

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
