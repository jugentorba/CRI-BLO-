name: Apply GeoReseaux Android hold timing fix

on:
  push:
    branches:
      - fix/georeseaux-android-hold-timing

permissions:
  contents: write

jobs:
  green-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/georeseaux-android-hold-timing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Apply hold-threshold production fix
        run: python3 scripts/apply-ios-android-hold-timing-fix.py
      - name: Verify Android hold timing regression GREEN
        run: npm run test:ios-longpress-bridge
      - name: Verify pan and touch cancellation
        run: node scripts/test-ios-longpress-cancel.mjs
      - name: Verify GeoReseaux UA parity
        run: npm run test:ios-georeseaux-ua-parity
      - name: Commit verified production fix and remove temporary applicators
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          git rm -f scripts/apply-ios-android-hold-timing-test.py scripts/apply-ios-android-hold-timing-fix.py
          git rm -f .github/workflows/apply-georeseaux-android-hold-timing-test.yml .github/workflows/apply-georeseaux-android-hold-timing-fix.yml
          git commit -m 'fix: fire GeoReseaux contextmenu at Android hold threshold'
          git push origin HEAD:fix/georeseaux-android-hold-timing
