name: Apply GeoReseaux v8 patch

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - .github/workflows/patch-georeseaux-v8.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0

      - name: Apply targeted browser patch
        run: python .github/patch_georeseaux_v8.py

      - name: Validate injected JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift').read_text(encoding='utf-8')
          marker = 'private static let longPressBridgeScript = #"""'
          start = source.index(marker) + len(marker)
          end = source.index('"""#', start)
          Path('/tmp/criblo-longpress-v8.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/criblo-longpress-v8.js
          grep -F "raw = new PointerEvent('contextmenu'" plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          grep -F "offsetX: offsetX" plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          grep -F "pointerType: 'touch'" plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          grep -F "Event properties read:" plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          git diff --check

      - name: Commit patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          git rm .github/patch_georeseaux_v8.py .github/workflows/patch-georeseaux-v8.yml
          git commit -m "Fix GeoReseaux Android-touch event fidelity"
          git push origin HEAD:criblo-master-spec-v1
