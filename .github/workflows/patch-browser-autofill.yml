name: Patch CRI-BLO browser autofill

on:
  push:
    branches:
      - criblo-master-spec-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0

      - name: Enable secure system password autofill
        run: |
          python3 <<'PY'
          from pathlib import Path

          ios_path = Path('plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift')
          ios = ios_path.read_text()
          anchor = '''        configuration.defaultWebpagePreferences.preferredContentMode = .recommended\n\n        if longPressCompatibility {'''
          replacement = '''        configuration.defaultWebpagePreferences.preferredContentMode = .recommended\n\n        // WKWebView already participates in iOS Password AutoFill. This script\n        // adds standards-based autocomplete hints only when a website omitted\n        // them, improving iCloud Passwords and third-party credential providers\n        // without CRI-BLO reading or storing the credential itself.\n        configuration.userContentController.addUserScript(\n            WKUserScript(\n                source: Self.autofillCompatibilityScript,\n                injectionTime: .atDocumentEnd,\n                forMainFrameOnly: false\n            )\n        )\n\n        if longPressCompatibility {'''
          if 'source: Self.autofillCompatibilityScript' not in ios:
              if anchor not in ios:
                  raise SystemExit('iOS configuration anchor not found')
              ios = ios.replace(anchor, replacement, 1)

          script_anchor = '''    private static let longPressBridgeScript = #\"\"\"'''
          autofill_script = '''    private static let autofillCompatibilityScript = #\"\"\"\n    (function () {\n      if (window.__cribloAutofillInstalled) return;\n      window.__cribloAutofillInstalled = true;\n\n      function mark(input) {\n        if (!input || input.nodeType !== 1 || input.tagName !== 'INPUT') return;\n        var type = String(input.getAttribute('type') || 'text').toLowerCase();\n        var current = String(input.getAttribute('autocomplete') || '').trim().toLowerCase();\n        // Respect an explicit site decision. Only repair fields where the site\n        // supplied no meaningful autocomplete metadata.\n        if (current && current !== 'on') return;\n        var hint = [\n          input.getAttribute('name'),\n          input.getAttribute('id'),\n          input.getAttribute('placeholder'),\n          input.getAttribute('aria-label')\n        ].filter(Boolean).join(' ').toLowerCase();\n\n        if (type === 'password') {\n          input.setAttribute('autocomplete', /new|create|confirm|nouveau|confirmer|signup|register/.test(hint)\n            ? 'new-password'\n            : 'current-password');\n          return;\n        }\n        if (/user|username|login|email|mail|identifiant|compte|account/.test(hint)) {\n          input.setAttribute('autocomplete', 'username');\n          return;\n        }\n        if (/otp|one.?time|verification|vérification|security.?code|code.?securite|code.?sécurité/.test(hint)) {\n          input.setAttribute('autocomplete', 'one-time-code');\n        }\n      }\n\n      function scan(root) {\n        try {\n          if (root && root.matches && root.matches('input')) mark(root);\n          var nodes = root && root.querySelectorAll ? root.querySelectorAll('input') : [];\n          for (var i = 0; i < nodes.length; i++) mark(nodes[i]);\n        } catch (_) {}\n      }\n\n      scan(document);\n      try {\n        new MutationObserver(function (changes) {\n          for (var i = 0; i < changes.length; i++) {\n            var added = changes[i].addedNodes || [];\n            for (var j = 0; j < added.length; j++) scan(added[j]);\n          }\n        }).observe(document.documentElement || document, { childList: true, subtree: true });\n      } catch (_) {}\n    })();\n    \"\"\"#\n\n'''
          if 'private static let autofillCompatibilityScript' not in ios:
              if script_anchor not in ios:
                  raise SystemExit('iOS script anchor not found')
              ios = ios.replace(script_anchor, autofill_script + script_anchor, 1)
          ios_path.write_text(ios)

          android_path = Path('plugins/criblo-native-browser/android/src/main/java/com/criblo/nativebrowser/CRIBrowserPlugin.java')
          android = android_path.read_text()
          if 'import android.os.Build;' not in android:
              android = android.replace('import android.os.Message;\n', 'import android.os.Message;\nimport android.os.Build;\n')
          if 'import android.view.View;' not in android:
              android = android.replace('import android.view.KeyEvent;\n', 'import android.view.KeyEvent;\nimport android.view.View;\n')

          settings_anchor = '''        settings.setDatabaseEnabled(true);\n        settings.setSupportMultipleWindows(true);'''
          settings_replacement = '''        settings.setDatabaseEnabled(true);\n        settings.setSaveFormData(true);\n        settings.setSupportMultipleWindows(true);'''
          if 'settings.setSaveFormData(true);' not in android:
              if settings_anchor not in android:
                  raise SystemExit('Android settings anchor not found')
              android = android.replace(settings_anchor, settings_replacement, 1)

          cookies_anchor = '''        CookieManager cookies = CookieManager.getInstance();'''
          autofill_setup = '''        // Make the embedded browser participate explicitly in Android's Autofill\n        // framework (Google Password Manager or the user's selected provider).\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n            webView.setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_YES);\n        }\n\n'''
          if 'setImportantForAutofill' not in android:
              if cookies_anchor not in android:
                  raise SystemExit('Android cookies anchor not found')
              android = android.replace(cookies_anchor, autofill_setup + cookies_anchor, 1)

          finish_anchor = '''            public void onPageFinished(WebView view, String url) {\n                updateAddress(url);\n            }'''
          finish_replacement = '''            public void onPageFinished(WebView view, String url) {\n                updateAddress(url);\n                view.evaluateJavascript(AUTOFILL_COMPATIBILITY_SCRIPT, null);\n            }'''
          if 'evaluateJavascript(AUTOFILL_COMPATIBILITY_SCRIPT' not in android:
              if finish_anchor not in android:
                  raise SystemExit('Android onPageFinished anchor not found')
              android = android.replace(finish_anchor, finish_replacement, 1)

          class_anchor = '''public class CRIBrowserPlugin extends Plugin {\n    private Dialog activeDialog;'''
          android_script = '''public class CRIBrowserPlugin extends Plugin {\n    private static final String AUTOFILL_COMPATIBILITY_SCRIPT = \"\"\"\n        (function(){\n          function mark(i){\n            if(!i||i.tagName!=='INPUT')return;\n            var t=String(i.getAttribute('type')||'text').toLowerCase();\n            var a=String(i.getAttribute('autocomplete')||'').trim().toLowerCase();\n            if(a&&a!=='on')return;\n            var h=[i.getAttribute('name'),i.getAttribute('id'),i.getAttribute('placeholder'),i.getAttribute('aria-label')].filter(Boolean).join(' ').toLowerCase();\n            if(t==='password'){i.setAttribute('autocomplete',/new|create|confirm|nouveau|confirmer|signup|register/.test(h)?'new-password':'current-password');return;}\n            if(/user|username|login|email|mail|identifiant|compte|account/.test(h)){i.setAttribute('autocomplete','username');return;}\n            if(/otp|one.?time|verification|security.?code|code.?securite/.test(h)){i.setAttribute('autocomplete','one-time-code');}\n          }\n          var n=document.querySelectorAll('input');for(var x=0;x<n.length;x++)mark(n[x]);\n        })();\n        \"\"\";\n\n    private Dialog activeDialog;'''
          if 'AUTOFILL_COMPATIBILITY_SCRIPT =' not in android:
              if class_anchor not in android:
                  raise SystemExit('Android class anchor not found')
              android = android.replace(class_anchor, android_script, 1)
          android_path.write_text(android)
          PY

      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-browser-autofill.yml
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift \
                  plugins/criblo-native-browser/android/src/main/java/com/criblo/nativebrowser/CRIBrowserPlugin.java
          git commit -m "Enable system password autofill in native browser"
          git push origin HEAD:criblo-master-spec-v1
