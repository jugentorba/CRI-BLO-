name: Apply GeoReseaux Android trace patch

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - scripts/patch-georeseaux-android-trace.mjs
      - .github/workflows/apply-georeseaux-android-trace.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0

      - name: Apply measured Android event sequence to iOS bridge
        run: node scripts/patch-georeseaux-android-trace.mjs

      - name: Commit patched iOS bridge
        run: |
          if git diff --quiet -- plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          git commit -m "Match GeoReseaux iOS hold to Android event trace"
          git push origin HEAD:criblo-master-spec-v1
