name: Verify CRI-BLO repair branch

on:
  push:
    branches:
      - fix/criblo-release-gps-ai-updater
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regression checks
        run: node scripts/test-repair-regressions.mjs
