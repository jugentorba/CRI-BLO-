name: Verify CRI-BLO repair branch

on:
  push:
    branches:
      - fix/criblo-release-gps-ai-updater
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regression checks
        run: node scripts/test-repair-regressions.mjs

      - name: Lint source
        run: npm run lint

      - name: Build production web bundle
        env:
          VITE_CRI_BLO_VERSION: repair-test
        run: npm run build

      - name: Prepare Android compile test
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/android@8.5.0 @capacitor/cli@8.5.0
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/patch-android-updater.mjs
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'CriBloUpdaterPlugin.class' android/app/src/main/java/com/criblo/app/MainActivity.java
          grep -q 'class CriBloUpdaterPlugin' android/app/src/main/java/com/criblo/app/CriBloUpdaterPlugin.java

      - name: Compile Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
