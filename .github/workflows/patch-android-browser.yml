name: Patch Android browser diagnostic

on:
  push:
    branches:
      - criblo-master-spec-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1

      - name: Patch Android browser source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('plugins/criblo-native-browser/android/src/main/java/com/criblo/nativebrowser/CRIBrowserPlugin.java')
          src = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global src
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              src = src.replace(old, new, 1)

          replace_once('import android.app.Dialog;\n', 'import android.app.Dialog;\nimport android.Manifest;\n', 'Manifest import')
          replace_once('import android.content.Intent;\n', 'import android.content.Intent;\nimport android.content.pm.PackageManager;\n', 'PackageManager import')
          replace_once('import android.view.KeyEvent;\n', 'import android.view.KeyEvent;\nimport android.view.MotionEvent;\n', 'MotionEvent import')
          replace_once('import android.webkit.CookieManager;\n', 'import android.webkit.CookieManager;\nimport android.webkit.GeolocationPermissions;\n', 'GeolocationPermissions import')
          replace_once('import android.webkit.WebResourceRequest;\n', 'import android.webkit.WebResourceRequest;\nimport android.webkit.WebResourceResponse;\n', 'WebResourceResponse import')

          trace_block = r'''    private static final String GEORESEAUX_TRACE_SCRIPT = """
              (function(){
                if(window.__cribloAndroidGeoTraceInstalled)return;
                window.__cribloAndroidGeoTraceInstalled=true;
                var trace={events:[],requests:[],started:Date.now()};
                function trim(list,max){while(list.length>max)list.shift();}
                function cleanUrl(raw,base){
                  try{var u=new URL(String(raw||''),base||location.href);return u.origin+u.pathname;}catch(_){return String(raw||'').split('?')[0].slice(0,180);}
                }
                function targetName(t){
                  try{return String((t&&t.tagName)||'')+'#'+String((t&&t.id)||'')+'.'+String((t&&t.className)||'').slice(0,60);}catch(_){return '?';}
                }
                function eventPoint(e){
                  try{
                    var t=(e.changedTouches&&e.changedTouches.length?e.changedTouches[0]:(e.touches&&e.touches.length?e.touches[0]:e));
                    return ' client='+String(Math.round(Number(t.clientX)||0))+','+String(Math.round(Number(t.clientY)||0))+
                      ' page='+String(Math.round(Number(t.pageX)||0))+','+String(Math.round(Number(t.pageY)||0));
                  }catch(_){return '';}
                }
                function eventRow(e,label){
                  try{
                    var pointer=e&&e.pointerType?('/'+e.pointerType):'';
                    var row=String(Date.now()-trace.started)+'ms '+String(label||'top')+' '+String(e.type)+pointer+
                      ' trusted='+String(!!e.isTrusted)+' target='+targetName(e.target)+
                      ' button='+String(e.button==null?'na':e.button)+' buttons='+String(e.buttons==null?'na':e.buttons)+
                      ' offset='+String(Math.round(Number(e.offsetX)||0))+','+String(Math.round(Number(e.offsetY)||0))+
                      eventPoint(e)+' pressure='+String(e.pressure==null?'na':e.pressure)+
                      ' touches='+String(e.touches?e.touches.length:'na')+' changed='+String(e.changedTouches?e.changedTouches.length:'na');
                    trace.events.push(row);
                    trim(trace.events,48);
                  }catch(_){}
                }
                function addRequest(row){try{trace.requests.push(String(Date.now()-trace.started)+'ms '+row);trim(trace.requests,36);}catch(_){} }
                function installFrame(w,label){
                  try{
                    if(!w||!w.document)return;
                    if(!w.__cribloAndroidGeoTraceFrameInstalled){
                      w.__cribloAndroidGeoTraceFrameInstalled=true;
                      ['pointerdown','touchstart','mousedown','contextmenu','pointerup','touchend','mouseup','auxclick','click','touchcancel','pointercancel'].forEach(function(name){
                        try{w.document.addEventListener(name,function(e){eventRow(e,label);},true);}catch(_){}
                      });
                      try{
                        if(typeof w.fetch==='function'){
                          var originalFetch=w.fetch;
                          w.fetch=function(input,init){
                            var method=String((init&&init.method)||(input&&input.method)||'GET').toUpperCase();
                            var raw=(input&&input.url)||input;
                            var prefix='fetch '+method+' '+cleanUrl(raw,w.location&&w.location.href);
                            return originalFetch.apply(this,arguments).then(function(response){addRequest(prefix+' -> '+response.status);return response;},function(error){addRequest(prefix+' -> error');throw error;});
                          };
                        }
                      }catch(_){}
                      try{
                        var originalOpen=w.XMLHttpRequest.prototype.open;
                        var originalSend=w.XMLHttpRequest.prototype.send;
                        w.XMLHttpRequest.prototype.open=function(method,url){
                          try{this.__cribloMethod=String(method||'GET').toUpperCase();this.__cribloURL=cleanUrl(url,w.location&&w.location.href);}catch(_){}
                          return originalOpen.apply(this,arguments);
                        };
                        w.XMLHttpRequest.prototype.send=function(){
                          try{
                            if(!this.__cribloTraceHook){
                              this.__cribloTraceHook=true;
                              this.addEventListener('loadend',function(){addRequest('xhr '+String(this.__cribloMethod||'GET')+' '+String(this.__cribloURL||'')+' -> '+String(this.status||0));});
                            }
                          }catch(_){}
                          return originalSend.apply(this,arguments);
                        };
                      }catch(_){}
                    }
                    var frames=w.frames||[];
                    for(var i=0;i<frames.length;i++){
                      try{installFrame(frames[i],label+'/f'+i);}catch(_){}
                    }
                  }catch(_){}
                }
                function scan(){try{installFrame(window,'top');}catch(_){} }
                scan();
                try{setInterval(scan,1000);}catch(_){}
                window.__cribloAndroidGeoTraceText=function(){
                  var scripts=[];
                  try{
                    var nodes=document.scripts||[];
                    for(var i=0;i<nodes.length;i++){
                      var src=String(nodes[i].src||'');
                      if(!src)continue;
                      try{var u=new URL(src,location.href);src=u.pathname.split('/').pop()||u.pathname;}catch(_){}
                      if(scripts.indexOf(src)<0)scripts.push(src.slice(0,80));
                      if(scripts.length>=12)break;
                    }
                  }catch(_){}
                  return [
                    'URL: '+String(location.href||'').split('?')[0].slice(0,180),
                    'UA: '+String(navigator.userAgent||'').slice(0,180),
                    'Platform: '+String(navigator.platform||''),
                    'Events: '+(trace.events.join(' > ')||'none'),
                    'Requests: '+(trace.requests.join(' | ')||'none'),
                    'Scripts: '+(scripts.join(', ')||'none')
                  ].join(String.fromCharCode(10));
                };
              })();
              """;

          '''
          src, count = re.subn(
              r'    private static final String GEORESEAUX_TRACE_SCRIPT = """.*?        """;\n\n',
              lambda _: trace_block,
              src,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'GeoReseaux trace block: expected 1 match, found {count}')

          replace_once(
              '    private int activeTab = 0;\n',
              '''    private int activeTab = 0;\n    private final ArrayList<String> nativeTouchTrace = new ArrayList<>();\n    private final ArrayList<String> nativeRequestTrace = new ArrayList<>();\n''',
              'native trace fields',
          )

          replace_once(
              '        settings.setDatabaseEnabled(true);\n        settings.setSaveFormData(true);\n',
              '        settings.setDatabaseEnabled(true);\n        settings.setGeolocationEnabled(true);\n        settings.setSaveFormData(true);\n',
              'geolocation setting',
          )

          replace_once(
              '        webView.setLongClickable(true);\n        webView.setHapticFeedbackEnabled(true);\n\n        webView.setWebViewClient(new WebViewClient() {\n',
              '''        webView.setLongClickable(true);\n        webView.setHapticFeedbackEnabled(true);\n        webView.setOnTouchListener((view, event) -> {\n            recordNativeTouch(event);\n            return false;\n        });\n\n        webView.setWebViewClient(new WebViewClient() {\n''',
              'native touch observer',
          )

          replace_once(
              '            @Override\n            public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {\n',
              '''            @Override\n            public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {\n                recordNativeRequest(request);\n                return super.shouldInterceptRequest(view, request);\n            }\n\n            @Override\n            public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {\n''',
              'native request observer',
          )

          replace_once(
              '            @Override\n            public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {\n',
              '''            @Override\n            public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {\n                boolean granted = hasLocationPermission();\n                callback.invoke(origin, granted, granted);\n            }\n\n            @Override\n            public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {\n''',
              'WebView geolocation permission callback',
          )

          helpers = '''    private void recordNativeTouch(MotionEvent event) {\n        if (event == null) return;\n        String action = switch (event.getActionMasked()) {\n            case MotionEvent.ACTION_DOWN -> "down";\n            case MotionEvent.ACTION_MOVE -> "move";\n            case MotionEvent.ACTION_UP -> "up";\n            case MotionEvent.ACTION_CANCEL -> "cancel";\n            default -> "action-" + event.getActionMasked();\n        };\n        String tool = "unknown";\n        if (event.getPointerCount() > 0) {\n            tool = switch (event.getToolType(0)) {\n                case MotionEvent.TOOL_TYPE_FINGER -> "finger";\n                case MotionEvent.TOOL_TYPE_STYLUS -> "stylus";\n                case MotionEvent.TOOL_TYPE_MOUSE -> "mouse";\n                case MotionEvent.TOOL_TYPE_ERASER -> "eraser";\n                default -> "unknown";\n            };\n        }\n        String row = (event.getEventTime() - event.getDownTime()) + "ms " + action + "/" + tool\n            + " x=" + Math.round(event.getX()) + " y=" + Math.round(event.getY())\n            + " pressure=" + event.getPressure() + " buttons=" + event.getButtonState();\n        synchronized (nativeTouchTrace) {\n            nativeTouchTrace.add(row);\n            while (nativeTouchTrace.size() > 48) nativeTouchTrace.remove(0);\n        }\n    }\n\n    private void recordNativeRequest(WebResourceRequest request) {\n        if (request == null || request.getUrl() == null) return;\n        Uri uri = request.getUrl();\n        String host = uri.getHost() == null ? "" : uri.getHost();\n        String path = uri.getPath() == null ? "" : uri.getPath();\n        String row = String.valueOf(request.getMethod()).toUpperCase() + " " + host + path;\n        synchronized (nativeRequestTrace) {\n            nativeRequestTrace.add(row);\n            while (nativeRequestTrace.size() > 48) nativeRequestTrace.remove(0);\n        }\n    }\n\n    private boolean hasLocationPermission() {\n        return getActivity().checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED\n            || getActivity().checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;\n    }\n\n    private String nativeTraceText() {\n        String touch;\n        String requests;\n        synchronized (nativeTouchTrace) {\n            touch = nativeTouchTrace.isEmpty() ? "none" : String.join(" > ", nativeTouchTrace);\n        }\n        synchronized (nativeRequestTrace) {\n            requests = nativeRequestTrace.isEmpty() ? "none" : String.join(" | ", nativeRequestTrace);\n        }\n        return "Native touch: " + touch\n            + "\\nNative requests: " + requests\n            + "\\nAndroid location permission: " + (hasLocationPermission() ? "granted" : "missing");\n    }\n\n'''

          marker = '    private void showGeoDiagnostics() {\n'
          if src.count(marker) != 1:
              raise SystemExit('showGeoDiagnostics marker missing or duplicated')
          src = src.replace(marker, helpers + marker, 1)

          diagnostic_method = '''    private void showGeoDiagnostics() {\n        if (activeWebView == null) return;\n        String script = "window.__cribloAndroidGeoTraceText ? window.__cribloAndroidGeoTraceText() : 'JS trace unavailable; native fallback follows.'";\n        activeWebView.evaluateJavascript(script, value -> {\n            String message = "JS trace unavailable; native fallback follows.";\n            try {\n                if (value != null) message = new JSONArray("[" + value + "]").getString(0);\n            } catch (Exception ignored) {}\n            final String display = message + "\\n" + nativeTraceText();\n            getActivity().runOnUiThread(() -> new AlertDialog.Builder(getActivity())\n                .setTitle("Diagnostic GeoReseaux Android")\n                .setMessage(display)\n                .setPositiveButton("OK", null)\n                .show());\n        });\n    }\n\n'''
          src, count = re.subn(
              r'    private void showGeoDiagnostics\(\) \{.*?\n    \}\n\n(?=    private void showHistory\(\))',
              lambda _: diagnostic_method,
              src,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'showGeoDiagnostics replacement: expected 1 match, found {count}')

          path.write_text(src, encoding='utf-8')
          PY

      - name: Verify expected Android changes
        run: |
          grep -F "settings.setGeolocationEnabled(true);" plugins/criblo-native-browser/android/src/main/java/com/criblo/nativebrowser/CRIBrowserPlugin.java
          grep -F "onGeolocationPermissionsShowPrompt" plugins/criblo-native-browser/android/src/main/java/com/criblo/nativebrowser/CRIBrowserPlugin.java
          grep -F "String.fromCharCode(10)" plugins/criblo-native-browser/android/src/main/java/com/criblo/nativebrowser/CRIBrowserPlugin.java
          grep -F "Native touch:" plugins/criblo-native-browser/android/src/main/java/com/criblo/nativebrowser/CRIBrowserPlugin.java

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/criblo-native-browser/android/src/main/java/com/criblo/nativebrowser/CRIBrowserPlugin.java
          git commit -m "Fix Android GeoReseaux diagnostic and browser location"
          git push origin HEAD:criblo-master-spec-v1
