name: Patch GeoReseaux v7

on:
  push:
    paths:
      - '.github/workflows/patch-georeseaux-v7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0
      - name: Apply GeoReseaux v7
        run: python3 scripts/patch_georeseaux_v7.py
      - name: Commit v7 and remove helpers
        run: |
          rm scripts/patch_georeseaux_v7.py .github/workflows/patch-georeseaux-v7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift scripts/patch_georeseaux_v7.py .github/workflows/patch-georeseaux-v7.yml
          git commit -m 'Match Android network identity for GeoReseaux on iOS'
          git push origin HEAD:criblo-master-spec-v1
