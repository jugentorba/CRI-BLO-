name: Patch GeoReseaux v6

on:
  push:
    paths:
      - '.github/workflows/patch-georeseaux-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0
      - name: Apply v6 map patch
        run: python3 scripts/patch_georeseaux_v6.py
      - name: Commit patched browser
        run: |
          rm scripts/patch_georeseaux_v6.py .github/workflows/patch-georeseaux-v6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift scripts/patch_georeseaux_v6.py .github/workflows/patch-georeseaux-v6.yml
          git commit -m 'Register live map engines and call GeoReseaux hold handlers'
          git push origin HEAD:criblo-master-spec-v1
