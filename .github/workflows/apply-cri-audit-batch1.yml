name: Apply CRI audit batch 1

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - scripts/patch-cri-audit-batch1.mjs
      - .github/workflows/apply-cri-audit-batch1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audited fixes
        run: |
          set -euxo pipefail
          node scripts/patch-cri-audit-batch1.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-cri-field-regressions.mjs')
          s = p.read_text()
          bad = 'assert.match(route, /if \\(scope === "A" \\|\\| scope === "B"\\) \\{[\\s\\S]*?Point A\\/B : ne jamais écrire?aser/s, "A/B address isolation marker missing");'
          good = 'assert.ok(route.includes("// Point A/B : ne jamais écraser la localisation officielle du défaut."), "A/B address isolation marker missing");'
          if bad not in s:
              raise SystemExit('malformed isolation assertion not found')
          p.write_text(s.replace(bad, good))
          PY
          # The normal CI workflow is updated separately through the connected
          # GitHub API because the Actions token cannot modify workflow files.
          git checkout -- .github/workflows/ci.yml
          git diff --check
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Regression tests
        run: |
          npm run test:cri-regressions
          npm run test:ios-longpress-bridge
          npm run test:ios-georeseaux-ua-parity
      - name: Build and lint
        run: |
          npm run build
          npm run lint
      - name: Commit production fixes
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cri.'$id'.tsx src/lib/export/xlsx.ts src/lib/export/xlsx-config.ts src/lib/export/html.ts src/lib/geo/address-format.ts scripts/test-cri-field-regressions.mjs package.json
          git diff --cached --check
          git diff --cached --quiet && { echo "Expected audited fixes are missing"; exit 1; }
          git commit -m "Fix CRI GPS address export and N-A field bugs"
          git push origin HEAD:criblo-master-spec-v1
