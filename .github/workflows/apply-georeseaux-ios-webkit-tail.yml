name: Apply GeoReseaux iOS WebKit-tail fix

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - scripts/patch-georeseaux-ios-webkit-tail.mjs
      - .github/workflows/apply-georeseaux-ios-webkit-tail.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted bridge patch
        run: node scripts/patch-georeseaux-ios-webkit-tail.mjs
      - name: Run real-iPhone-order regression test
        run: node scripts/test-ios-longpress-bridge.mjs
      - name: Commit corrected bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Wait for iOS WebKit click before GeoReseaux contextmenu"
          git push origin HEAD:criblo-master-spec-v1
