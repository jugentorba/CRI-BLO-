name: Patch iOS GeoReseaux v12

on:
  push:
    branches:
      - criblo-master-spec-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0

      - name: Remove synthetic long-press competition
        shell: python
        run: |
          from pathlib import Path
          p = Path('plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift')
          s = p.read_text()

          old = """        if longPressCompatibility {
            let longPress = UILongPressGestureRecognizer(target: self, action: #selector(handleNativeLongPress(_:)))
            longPress.minimumPressDuration = 0.72
            longPress.cancelsTouchesInView = false
            longPress.delegate = self
            webView.addGestureRecognizer(longPress)
        }
"""
          new = """        if longPressCompatibility {
            // GeoReseaux v12: WebKit proved it emits a trusted contextmenu.
            // Do not race it with CRI-BLO's old 720ms synthetic recognizer.
        }
"""
          if s.count(old) != 1:
              raise SystemExit('native recognizer block mismatch')
          s = s.replace(old, new, 1)

          old = "          // Give native WebKit first chance to emit its own trusted contextmenu.\n          // Android does so at ~600ms; fallback only after that window.\n          realTouchTimer = setTimeout(fireRealTouchLongPress, 850);"
          new = "          // GeoReseaux v12 native-only isolation: do not synthesize a\n          // second contextmenu around WebKit's real trusted long press.\n          realTouchTimer = null;\n          __cribloGeoDiag.lastResult = 'native-only-waiting';"
          if s.count(old) != 1:
              raise SystemExit('JS fallback timer block mismatch')
          s = s.replace(old, new, 1)

          old = "          'Trusted context prevented: ' + String(!!__cribloGeoDiag.trustedContextPrevented),\n          'Event properties read: ' + (Object.keys(__cribloGeoDiag.eventProperties).sort().join(', ') || 'none'),"
          new = "          'Trusted context prevented: ' + String(!!__cribloGeoDiag.trustedContextPrevented),\n          'Native-only long press: true',\n          'Event properties read: ' + (Object.keys(__cribloGeoDiag.eventProperties).sort().join(', ') || 'none'),"
          if s.count(old) != 1:
              raise SystemExit('diagnostic output block mismatch')
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          git diff --cached --check
          git commit -m "Let trusted WebKit GeoReseaux hold run alone"
          git push origin HEAD:criblo-master-spec-v1
