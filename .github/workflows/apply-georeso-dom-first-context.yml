name: Validate GeoReseaux DOM-first context path

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - scripts/patch-georeso-dom-first-context.mjs
      - .github/workflows/apply-georeso-dom-first-context.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: criblo-master-spec-v1

jobs:
  patch:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.out.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply DOM-first fix
        run: |
          set -euxo pipefail
          node scripts/patch-georeso-dom-first-context.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-georeso-dom-first-context.mjs
          rm -f .github/workflows/apply-georeso-dom-first-context.yml
          git add -A
          git diff --cached --check
          git commit -m "Route GeoReseaux long press through DOM before OpenLayers"
          git push origin HEAD:${TARGET_BRANCH}
      - id: out
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  regression:
    needs: patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - name: Test DOM-first iOS lifecycle
        run: npm run test:ios-longpress-bridge

  real-openlayers-dom:
    needs: patch
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ol: ['6.15.1', '7.2.2', '10.6.1']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare real OpenLayers DOM fixture
        env:
          OL_VERSION: ${{ matrix.ol }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ol-dom-fixture
          cd /tmp/ol-dom-fixture
          npm init -y >/dev/null
          npm install --no-audit --no-fund "ol@${OL_VERSION}" vite@5 playwright-core@1.55.0
          node - "$GITHUB_WORKSPACE" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.argv[2];
          const swift = fs.readFileSync(path.join(root, 'plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift'), 'utf8');
          const match = swift.match(/private static let longPressBridgeScript = #\"\"\"([\s\S]*?)\"\"\"#/);
          if (!match) throw new Error('bridge not found');
          fs.writeFileSync('/tmp/ol-dom-fixture/bridge.js', match[1]);
          NODE
          cat > index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>
          html,body{margin:0;width:100%;height:100%;touch-action:none} #map{position:absolute;left:20px;top:20px;width:600px;height:400px;touch-action:none}
          .fixture-popup{position:absolute;left:200px;top:150px;width:220px;height:90px;background:white;border:1px solid black;z-index:9999}
          </style></head><body><div id="map"></div><script src="/bridge.js"></script><script type="module" src="/main.js"></script></body></html>
          HTML
          cat > main.js <<'JS'
          import Map from 'ol/Map.js';
          import View from 'ol/View.js';
          const map = new Map({target:'map', layers:[], view:new View({center:[0,0], zoom:2})});
          window.__domCalls = 0;
          window.__mapCalls = 0;
          const viewport = map.getViewport();
          viewport.addEventListener('contextmenu', (event) => {
            window.__domCalls += 1;
            window.__domTrusted = event.isTrusted === true && Boolean(event.originalEvent && event.originalEvent.isTrusted);
            const popup = document.createElement('div');
            popup.className = 'fixture-popup';
            popup.textContent = 'GEO_DOM_CONTEXT_OPENED';
            document.body.appendChild(popup);
            event.preventDefault();
          });
          map.on('contextmenu', () => { window.__mapCalls += 1; });
          window.__fixtureReady = true;
          JS
      - name: Trusted touch must reach DOM listener before OpenLayers fallback
        env:
          OL_VERSION: ${{ matrix.ol }}
        run: |
          set -euxo pipefail
          cd /tmp/ol-dom-fixture
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          npx vite --host 127.0.0.1 --port 4175 >/tmp/vite-dom.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true; cat /tmp/vite-dom.log || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4175/ >/dev/null && break; sleep .25; done
          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({executablePath:process.env.CHROME_PATH, headless:true, args:['--no-sandbox','--disable-dev-shm-usage']});
            const context = await browser.newContext({viewport:{width:800,height:600},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 Chrome/139.0.0.0 Mobile Safari/537.36'});
            const page = await context.newPage();
            const cdp = await context.newCDPSession(page);
            await page.goto('http://127.0.0.1:4175/', {waitUntil:'networkidle'});
            await page.waitForFunction(() => window.__fixtureReady === true);
            const x=260,y=180;
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y,radiusX:4,radiusY:4,force:1,id:1}]});
            await new Promise(r=>setTimeout(r,720));
            const armed = await page.evaluate(() => window.__cribloGeoDiagnosticsText());
            if (!/JS trusted hold arms: 1/.test(armed)) throw new Error('trusted hold did not arm\n'+armed);
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            await page.waitForFunction(() => document.querySelector('.fixture-popup')?.textContent === 'GEO_DOM_CONTEXT_OPENED', null, {timeout:2500});
            const result = await page.evaluate(() => ({domCalls:window.__domCalls,mapCalls:window.__mapCalls,domTrusted:window.__domTrusted===true,diag:window.__cribloGeoDiagnosticsText()}));
            console.log(JSON.stringify(result));
            if (result.domCalls !== 1) throw new Error('DOM context listener calls=' + result.domCalls);
            if (!result.domTrusted) throw new Error('DOM listener did not receive trusted touch facade');
            if (result.mapCalls !== 1) throw new Error('OpenLayers map context calls=' + result.mapCalls);
            if (!/OpenLayers direct: 0 \/ feature hits: 0 \/ recovery: OpenLayers-bound/.test(result.diag)) throw new Error('direct map bypass still used\n' + result.diag);
            if (!/Context events: 1 \/ observed: 1/.test(result.diag)) throw new Error('DOM context was not dispatched exactly once\n' + result.diag);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME_PATH="$CHROME" OL_VERSION="$OL_VERSION" node verify.cjs

  ios-build:
    needs: patch
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - run: node scripts/patch-ios-info.mjs
      - name: Build simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/ios-device-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
