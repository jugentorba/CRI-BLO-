name: Patch iOS GeoReseaux v14

on:
  push:
    branches:
      - criblo-master-spec-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0

      - name: Invoke GeoReseaux handler with trusted touch facade at Android timing
        shell: python
        run: |
          from pathlib import Path
          p = Path('plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift')
          s = p.read_text()

          old = "            longPress.minimumPressDuration = 0.72"
          new = "            // Android trace: context action begins at about 600 ms.\n            longPress.minimumPressDuration = 0.60"
          if s.count(old) != 1:
              raise SystemExit('recognizer duration mismatch')
          s = s.replace(old, new, 1)

          old = "        // v13: record only. Do not manufacture pointer/touch/contextmenu JS.\n        let script = \"window.__cribloRecordNativeRecognizer && window.__cribloRecordNativeRecognizer(\\(rx), \\(ry));\"\n        webView.evaluateJavaScript(script, completionHandler: nil)"
          new = "        // v14: do not dispatch an untrusted DOM contextmenu. Call the page's\n        // already-registered contextmenu handler directly, with a facade backed\n        // by the genuine trusted iOS touchstart event, at Android's ~600ms timing.\n        let script = \"window.__cribloNativeTrustedHandlerLongPress && window.__cribloNativeTrustedHandlerLongPress(\\(rx), \\(ry));\"\n        webView.evaluateJavaScript(script, completionHandler: nil)"
          if s.count(old) != 1:
              raise SystemExit('native handler v13 block mismatch')
          s = s.replace(old, new, 1)

          old = "        nativeRecognizerFires: 0\n      };"
          new = "        nativeRecognizerFires: 0,\n        directTrustedHandlerFires: 0,\n        directSourceTrusted: false,\n        directTarget: 'none'\n      };"
          if s.count(old) != 1:
              raise SystemExit('diag object mismatch')
          s = s.replace(old, new, 1)

          marker = "      window.__cribloRecordNativeRecognizer = function () {\n        try {\n          __cribloGeoDiag.nativeRecognizerFires++;\n          __cribloGeoDiag.lastResult = 'native-recognizer-fired';\n        } catch (_) {}\n        return true;\n      };\n\n"
          replacement = marker + "      window.__cribloNativeTrustedHandlerLongPress = function (rx, ry) {\n        try {\n          __cribloGeoDiag.nativeRecognizerFires++;\n          var x = window.innerWidth * clamp01(rx);\n          var y = window.innerHeight * clamp01(ry);\n          var candidates = candidateElements(x, y);\n          var target = realTouchTarget || (candidates.length ? candidates[0] : null);\n          if (!target) {\n            __cribloGeoDiag.lastResult = 'direct-no-target';\n            return false;\n          }\n          var source = window.__cribloLastTrustedTouchStart || null;\n          __cribloGeoDiag.directSourceTrusted = !!(source && source.isTrusted);\n          __cribloGeoDiag.directTarget = String((target.tagName || '') + '#' + (target.id || '') + '.' + (target.className && (target.className.baseVal || target.className) || '')).slice(0, 180);\n          __cribloGeoDiag.lastTarget = __cribloGeoDiag.directTarget;\n          var before = visiblePopupState();\n          var callsBefore = __cribloGeoDiag.capturedCalls;\n          var invoked = invokeCapturedSemanticHandlers(target, x, y, source);\n          var delta = __cribloGeoDiag.capturedCalls - callsBefore;\n          __cribloGeoDiag.directTrustedHandlerFires += delta;\n          __cribloGeoDiag.lastResult = invoked ? 'direct-trusted-handler-called' : 'direct-no-handler';\n          setTimeout(function () {\n            if (popupChanged(before)) __cribloGeoDiag.lastResult = 'direct-handler-popup';\n            else if (invoked) __cribloGeoDiag.lastResult = 'direct-handler-no-popup';\n          }, 220);\n          return invoked;\n        } catch (_) {\n          __cribloGeoDiag.lastResult = 'direct-handler-error';\n          return false;\n        }\n      };\n\n"
          if s.count(marker) != 1:
              raise SystemExit('record recognizer marker mismatch')
          s = s.replace(marker, replacement, 1)

          old = "          'Native recognizer fires: ' + __cribloGeoDiag.nativeRecognizerFires,\n          'Synthetic context fallback: disabled',\n          'Event properties read: ' + (Object.keys(__cribloGeoDiag.eventProperties).sort().join(', ') || 'none'),"
          new = "          'Native recognizer fires: ' + __cribloGeoDiag.nativeRecognizerFires,\n          'Direct trusted handler fires: ' + __cribloGeoDiag.directTrustedHandlerFires,\n          'Direct source trusted: ' + String(!!__cribloGeoDiag.directSourceTrusted),\n          'Direct target: ' + (__cribloGeoDiag.directTarget || 'none'),\n          'Synthetic context fallback: disabled',\n          'Event properties read: ' + (Object.keys(__cribloGeoDiag.eventProperties).sort().join(', ') || 'none'),"
          if s.count(old) != 1:
              raise SystemExit('diagnostic output block mismatch')
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          git diff --cached --check
          git commit -m "Call GeoReseaux handler with trusted touch facade"
          git push origin HEAD:criblo-master-spec-v1
