name: Apply final GeoReseaux native gesture fix

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - scripts/patch-georeseaux-native-gesture.mjs
      - .github/workflows/apply-georeseaux-native-gesture.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: criblo-master-spec-v1

jobs:
  patch-and-validate-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Restore measured WebKit-tail path and apply native recognizer priority
        run: |
          set -euxo pipefail
          git revert --no-commit 07730c6e642ca7771f51edff0a4c136eb23a077e
          rm -f .github/workflows/apply-georeseaux-openlayers-ios.yml
          rm -f scripts/patch-georeseaux-openlayers-ios.mjs
          node scripts/patch-georeseaux-native-gesture.mjs
          rm -f scripts/patch-georeseaux-native-gesture.mjs
          rm -f .github/workflows/apply-georeseaux-native-gesture.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prioritize GeoReseaux native long press on iOS"
          git push origin HEAD:${TARGET_BRANCH}
          test -z "$(git status --porcelain)"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Lint source
        run: npm run lint

      - name: Test measured iPhone WebKit-tail bridge
        run: npm run test:ios-longpress-bridge

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Apply CRI-BLO iOS privacy permissions
        run: node scripts/patch-ios-info.mjs

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios-device-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload CRI-BLO-iOS-native-gesture-fix.ipa
          mkdir -p Payload
          cp -R ios-device-build/Build/Products/Debug-iphoneos/App.app Payload/App.app
          zip -qry CRI-BLO-iOS-native-gesture-fix.ipa Payload
          unzip -t CRI-BLO-iOS-native-gesture-fix.ipa
          unzip -l CRI-BLO-iOS-native-gesture-fix.ipa | grep -F 'Payload/App.app/Info.plist'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CRI-BLO-iOS-native-gesture-fix
          path: CRI-BLO-iOS-native-gesture-fix.ipa
          if-no-files-found: error
