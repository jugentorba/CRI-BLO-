name: Bootstrap CRI-BLO Permanent Signing

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap-signing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CRI-BLO
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund

      - name: Prepare Android app
        working-directory: source
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/core@8.5.0 @capacitor/android@8.5.0 @capacitor/cli@8.5.0
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.criblo.app",
            "appName": "CRI BLO",
            "webDir": "dist"
          }
          JSON
          npm run build
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Set permanent baseline Android version
        working-directory: source
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = re.sub(r"versionCode\s+\d+", "versionCode 10000", s)
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "2.0.0"', s)
          p.write_text(s)
          PY

      - name: Enable Android permissions
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
          ]
          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              text = text.replace("<application", "\n".join(permissions) + "\n\n    <application", 1)
          if "android:usesCleartextTraffic=" not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          manifest.write_text(text)
          PY

      - name: Generate permanent CRI BLO signing key
        working-directory: source
        run: |
          set +x
          PASS="$(openssl rand -hex 24)"
          ALIAS="criblo"
          echo "::add-mask::$PASS"
          keytool -genkeypair -noprompt             -keystore android/criblo-release.jks             -storetype PKCS12             -storepass "$PASS"             -keypass "$PASS"             -alias "$ALIAS"             -keyalg RSA             -keysize 4096             -validity 36500             -dname "CN=CRI BLO,O=CRI BLO,C=FR"

          SHA1="$(keytool -list -v -keystore android/criblo-release.jks -storepass "$PASS" -alias "$ALIAS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)"
          B64="$(base64 -w 0 android/criblo-release.jks)"

          mkdir -p ../signing-output
          cp android/criblo-release.jks ../signing-output/criblo-release.jks
          {
            echo "ANDROID_KEYSTORE_BASE64=$B64"
            echo "ANDROID_STORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$PASS"
            echo "ANDROID_SIGNING_SHA1=$SHA1"
          } > ../signing-output/SIGNING-SECRETS.txt

          {
            echo "CRI BLO PERMANENT ANDROID SIGNING BACKUP"
            echo
            echo "Package: com.criblo.app"
            echo "Baseline versionCode: 10000"
            echo "SHA-1: $SHA1"
            echo
            echo "KEEP criblo-release.jks AND SIGNING-SECRETS.txt PRIVATE."
            echo "Every future production APK must use this exact same signing key."
            echo "Register this SHA-1 in the Google Cloud Android OAuth client."
          } > ../signing-output/README-KEEP-PRIVATE.txt

          printf '%s\n' "$PASS" > /tmp/criblo_store_password
          printf '%s\n' "$ALIAS" > /tmp/criblo_alias

      - name: Build permanently signed release APK
        working-directory: source/android
        run: |
          set +x
          PASS="$(cat /tmp/criblo_store_password)"
          ALIAS="$(cat /tmp/criblo_alias)"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon             -Pandroid.injected.signing.store.file="$PWD/criblo-release.jks"             -Pandroid.injected.signing.store.password="$PASS"             -Pandroid.injected.signing.key.alias="$ALIAS"             -Pandroid.injected.signing.key.password="$PASS"

      - name: Verify permanent APK signature
        working-directory: source
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" ../signing-output/CRI-BLO-PERMANENT.apk

      - name: Upload one-time signing package
        uses: actions/upload-artifact@v4
        with:
          name: CRI-BLO-PERMANENT-SIGNING-PACKAGE
          path: signing-output/
          if-no-files-found: error
          retention-days: 1
