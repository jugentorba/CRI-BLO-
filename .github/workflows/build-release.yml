name: Build CRI-BLO Signed Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "downloads/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: criblo-signed-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      VITE_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - name: Verify permanent Android signing configuration
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KP" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Checkout CRI-BLO
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund

      - name: Set release version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((10000 + RUN_NUMBER))
          VERSION_NAME="2.0.${VERSION_CODE}"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VITE_CRI_BLO_VERSION=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "CRI BLO release ${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Prepare Capacitor Android wrapper
        working-directory: source
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/core@8.5.0 @capacitor/android@8.5.0 @capacitor/cli@8.5.0 @capacitor/geolocation@8.2.2
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.criblo.app",
            "appName": "CRI BLO",
            "webDir": "dist"
          }
          JSON
          npm run build
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/patch-android-updater.mjs

      - name: Package downloadable PWA
        run: |
          mkdir -p output
          cd source
          zip -qr ../output/CRI-BLO-PWA.zip dist

      - name: Set monotonically increasing app version
        working-directory: source
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          s = re.sub(r"versionCode\s+\d+", f"versionCode {code}", s)
          s = re.sub(r'versionName\s+"[^"]+"', f'versionName "{name}"', s)
          p.write_text(s)
          print(f"CRI BLO versionName={name}, versionCode={code}")
          PY

      - name: Decode permanent signing key
        working-directory: source
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/criblo-release.jks

      - name: Build signed release APK
        working-directory: source/android
        env:
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/criblo-release.jks" \
            -Pandroid.injected.signing.store.password="$KEY_PASSWORD" \
            -Pandroid.injected.signing.key.alias="criblo" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK signature and certificate
        working-directory: source
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee android/app/build/outputs/apk/release/signing-certificate.txt
          EXPECTED="$(tr -d ':\\r\\n ' < android-release-certificate.sha256 | tr '[:lower:]' '[:upper:]')"
          ACTUAL="$(sed -n 's/^.*certificate SHA-256 digest: //p' android/app/build/outputs/apk/release/signing-certificate.txt | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL" || { echo "Could not read APK signer SHA-256 fingerprint"; exit 1; }
          test "$ACTUAL" = "$EXPECTED" || {
            echo "ERROR: APK signing certificate does not match the permanent CRI BLO certificate."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          }
          sha256sum "$APK" | tee android/app/build/outputs/apk/release/CRI-BLO-SIGNED.sha256

      - name: Collect signed APK
        run: |
          mkdir -p output
          cp source/android/app/build/outputs/apk/release/app-release.apk output/CRI-BLO.apk
          cp source/android/app/build/outputs/apk/release/signing-certificate.txt output/signing-certificate.txt
          cp source/android/app/build/outputs/apk/release/CRI-BLO-SIGNED.sha256 output/CRI-BLO-SIGNED.sha256
          test -s output/CRI-BLO-PWA.zip

      - name: Upload signed production APK
        uses: actions/upload-artifact@v4
        with:
          name: CRI-BLO-SIGNED
          path: |
            output/CRI-BLO.apk
            output/signing-certificate.txt
            output/CRI-BLO-SIGNED.sha256
            output/CRI-BLO-PWA.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              output/CRI-BLO.apk \
              output/CRI-BLO-PWA.zip \
              output/signing-certificate.txt \
              output/CRI-BLO-SIGNED.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              output/CRI-BLO.apk \
              output/CRI-BLO-PWA.zip \
              output/signing-certificate.txt \
              output/CRI-BLO-SIGNED.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "CRI-BLO ${VERSION_NAME}" \
              --notes "Signed CRI-BLO Android release. The in-app updater can install this APK over the existing app when the signing certificate matches."
          fi

      - name: Checkout main for direct downloads
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish

      - name: Refresh direct APK and PWA downloads
        run: |
          cd publish
          git fetch origin main
          git reset --hard origin/main
          mkdir -p downloads
          cp ../output/CRI-BLO.apk downloads/CRI-BLO.apk
          cp ../output/CRI-BLO-PWA.zip downloads/CRI-BLO-PWA.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/CRI-BLO.apk downloads/CRI-BLO-PWA.zip
          if ! git diff --cached --quiet; then
            git commit -m "build: publish CRI-BLO APK and PWA downloads"
            git push origin main
          fi
