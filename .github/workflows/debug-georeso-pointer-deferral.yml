name: Debug GeoReseaux pointer deferral gate

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - .github/workflows/debug-georeso-pointer-deferral.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare browser fixture
        run: |
          set -euxo pipefail
          mkdir -p /tmp/geo-debug && cd /tmp/geo-debug
          npm init -y >/dev/null
          npm install --no-audit --no-fund ol@7.2.2 vite@5 playwright-core@1.55.0
          node - "$GITHUB_WORKSPACE" <<'NODE'
          const fs=require('fs'); const path=require('path'); const root=process.argv[2];
          const swift=fs.readFileSync(path.join(root,'plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift'),'utf8');
          const m=swift.match(/private static let longPressBridgeScript = #\"\"\"([\s\S]*?)\"\"\"#/); if(!m) throw new Error('bridge missing');
          fs.writeFileSync('/tmp/geo-debug/bridge.js',m[1]);
          NODE
          cat > index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;touch-action:none}#map{position:absolute;left:20px;top:20px;width:600px;height:400px;touch-action:none}.popup{position:absolute;left:200px;top:150px;width:180px;height:80px;background:white;border:1px solid black;z-index:999}</style></head><body><div id="map"></div><script>window.__cribloGeoReseauxAndroidCompat=true;</script><script src="/bridge.js"></script><script type="module" src="/main.js"></script></body></html>
          HTML
          cat > main.js <<'JS'
          import Map from 'ol/Map.js'; import View from 'ol/View.js';
          const map=new Map({target:'map',layers:[],view:new View({center:[0,0],zoom:2})});
          const viewport=map.getViewport(); window.__seen=[]; window.__ctx=0;
          for(const type of ['pointerdown','touchstart','mousedown','pointerup','touchend','mouseup','click','contextmenu']) viewport.addEventListener(type,e=>window.__seen.push({type, trusted:e.isTrusted, pointerType:e.pointerType||'', synthetic:!e.isTrusted, defaultPrevented:e.defaultPrevented}));
          viewport.addEventListener('contextmenu',e=>{window.__ctx++;e.preventDefault();const p=document.createElement('div');p.className='popup';p.textContent='OPEN';document.body.appendChild(p);});
          window.__ready=true;
          JS
      - name: Drive long hold and print full state even if popup fails
        run: |
          set -euxo pipefail
          cd /tmp/geo-debug
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          npx vite --host 127.0.0.1 --port 4177 >/tmp/geo-debug-vite.log 2>&1 & SERVER=$!
          trap 'kill $SERVER || true; cat /tmp/geo-debug-vite.log || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4177/ >/dev/null && break; sleep .25; done
          cat > verify.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});const context=await browser.newContext({viewport:{width:800,height:600},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 Chrome/139.0.0.0 Mobile Safari/537.36'});const page=await context.newPage();const cdp=await context.newCDPSession(page);await page.goto('http://127.0.0.1:4177/',{waitUntil:'networkidle'});await page.waitForFunction(()=>window.__ready===true);await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:260,y:180,radiusX:4,radiusY:4,force:1,id:1}]});await new Promise(r=>setTimeout(r,720));const mid=await page.evaluate(()=>({seen:window.__seen.slice(),diag:window.__cribloGeoDiagnosticsText()}));console.log('MID='+JSON.stringify(mid,null,2));await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await new Promise(r=>setTimeout(r,700));const r=await page.evaluate(()=>({seen:window.__seen,ctx:window.__ctx,popup:document.querySelector('.popup')?.textContent||null,diag:window.__cribloGeoDiagnosticsText()}));console.log('FINAL='+JSON.stringify(r,null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME_PATH="$CHROME" node verify.cjs
