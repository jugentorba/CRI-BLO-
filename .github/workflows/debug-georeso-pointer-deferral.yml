name: Debug GeoReseaux pointer deferral gate

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - .github/workflows/debug-georeso-pointer-deferral.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare browser fixture
        run: |
          set -euxo pipefail
          mkdir -p /tmp/geo-debug && cd /tmp/geo-debug
          npm init -y >/dev/null
          npm install --no-audit --no-fund ol@7.2.2 vite@5 playwright-core@1.55.0
          node - "$GITHUB_WORKSPACE" <<'NODE'
          const fs=require('fs'); const path=require('path'); const root=process.argv[2];
          const swift=fs.readFileSync(path.join(root,'plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift'),'utf8');
          const m=swift.match(/private static let longPressBridgeScript = #\"\"\"([\s\S]*?)\"\"\"#/); if(!m) throw new Error('bridge missing');
          fs.writeFileSync('/tmp/geo-debug/bridge.js',m[1]);
          NODE
          cat > index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;touch-action:none}#map{position:absolute;left:20px;top:20px;width:600px;height:400px;touch-action:none}</style></head><body><div id="map"></div><script>window.__cribloGeoReseauxAndroidCompat=true;</script><script src="/bridge.js"></script><script>window.__patchedAdd=!String(EventTarget.prototype.addEventListener).includes('[native code]');</script><script type="module" src="/main.js"></script></body></html>
          HTML
          cat > main.js <<'JS'
          import Map from 'ol/Map.js'; import View from 'ol/View.js';
          const map=new Map({target:'map',layers:[],view:new View({center:[0,0],zoom:2})});
          const viewport=map.getViewport(); window.__seen=[];
          function snapshot(type,e){
            const t=e.target; let node=t, sig='', mapLike=false;
            for(let i=0;node&&i<8;i++,node=node.parentElement){sig=String((node.id||'')+' '+(node.className&&(node.className.baseVal||node.className)||'')).toLowerCase();if(/leaflet|ol-|openlayers|mapbox|maplibre|esri|map|carte|geo|viewer|canvas/.test(sig)){mapLike=true;break;}}
            window.__seen.push({type, trusted:e.isTrusted, pointerType:e.pointerType||'', tag:t?.tagName||'', cls:String(t?.className||''), compat:window.__cribloGeoReseauxAndroidCompat===true, mapLike, patchedAdd:window.__patchedAdd});
          }
          for(const type of ['pointerdown','touchstart','mousedown','pointerup','touchend','mouseup','click']) viewport.addEventListener(type,e=>snapshot(type,e));
          window.__ready=true;
          JS
      - name: Drive one real touch and print deferral inputs
        run: |
          set -euxo pipefail
          cd /tmp/geo-debug
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          npx vite --host 127.0.0.1 --port 4177 >/tmp/geo-debug-vite.log 2>&1 & SERVER=$!
          trap 'kill $SERVER || true; cat /tmp/geo-debug-vite.log || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4177/ >/dev/null && break; sleep .25; done
          cat > verify.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});const context=await browser.newContext({viewport:{width:800,height:600},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 Chrome/139.0.0.0 Mobile Safari/537.36'});const page=await context.newPage();const cdp=await context.newCDPSession(page);await page.goto('http://127.0.0.1:4177/',{waitUntil:'networkidle'});await page.waitForFunction(()=>window.__ready===true);await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:260,y:180,radiusX:4,radiusY:4,force:1,id:1}]});await new Promise(r=>setTimeout(r,100));await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await new Promise(r=>setTimeout(r,120));const r=await page.evaluate(()=>({seen:window.__seen,diag:window.__cribloGeoDiagnosticsText()}));console.log(JSON.stringify(r,null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME_PATH="$CHROME" node verify.cjs
