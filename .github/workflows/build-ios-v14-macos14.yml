name: Build CRI-BLO iOS v14 macOS 14

on:
  push:
    branches:
      - criblo-master-spec-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-v14:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies from public npm
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Apply CRI-BLO iOS privacy permissions
        run: node scripts/patch-ios-info.mjs

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios-device-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload CRI-BLO-iOS-v14-unsigned.ipa
          mkdir -p Payload
          cp -R ios-device-build/Build/Products/Debug-iphoneos/App.app Payload/App.app
          zip -qry CRI-BLO-iOS-v14-unsigned.ipa Payload
          test -s CRI-BLO-iOS-v14-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CRI-BLO-iOS-v14-unsigned
          path: CRI-BLO-iOS-v14-unsigned.ipa
          if-no-files-found: error
