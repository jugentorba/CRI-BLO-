name: Build CRI-BLO iOS v14 macOS 14

on:
  push:
    branches:
      - criblo-master-spec-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-v14:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest available Xcode
        shell: bash
        run: |
          set -e
          echo "Available Xcodes:"
          ls -d /Applications/Xcode*.app || true
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies from public npm
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Apply CRI-BLO iOS privacy permissions
        run: node scripts/patch-ios-info.mjs

      - name: Build iOS simulator app
        id: simulator
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-sim.log

      - name: Extract simulator compiler errors
        if: always()
        shell: bash
        run: |
          if [ -f xcodebuild-sim.log ]; then
            grep -nE 'error:|CRIBrowserPlugin\.swift|SwiftCompile|BUILD FAILED|CompileSwift' xcodebuild-sim.log | tail -n 500 > xcodebuild-errors.txt || true
          else
            echo 'xcodebuild-sim.log missing' > xcodebuild-errors.txt
          fi
          echo "Simulator outcome: ${{ steps.simulator.outcome }}" >> xcodebuild-errors.txt

      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CRI-BLO-iOS-v14-compiler-diagnostics
          path: |
            xcodebuild-sim.log
            xcodebuild-errors.txt
          if-no-files-found: warn

      - name: Stop after simulator failure
        if: steps.simulator.outcome == 'failure'
        run: exit 1

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios-device-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload CRI-BLO-iOS-v14-unsigned.ipa
          mkdir -p Payload
          cp -R ios-device-build/Build/Products/Debug-iphoneos/App.app Payload/App.app
          zip -qry CRI-BLO-iOS-v14-unsigned.ipa Payload
          test -s CRI-BLO-iOS-v14-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CRI-BLO-iOS-v14-unsigned
          path: CRI-BLO-iOS-v14-unsigned.ipa
          if-no-files-found: error
