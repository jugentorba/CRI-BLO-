name: Verify CRI BLO before release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test Gemini model requests (mock HTTP)
        run: node scripts/test-ai-models.mjs
      - name: Check known CRI BLO regressions
        run: node scripts/test-repair-regressions.mjs
      - name: Build PWA source
        run: npm run build
