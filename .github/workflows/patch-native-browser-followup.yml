name: Patch native browser safety

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - .github/workflows/patch-native-browser-followup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0

      - name: Fix native browser runtime and API compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          swift = Path('plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift')
          text = swift.read_text()
          old = '''        configureBottomChrome()\n        view.addSubview(webView)\n        view.addSubview(chrome)\n\n        let stack = chrome.contentView.subviews.first!'''
          new = '''        view.addSubview(webView)\n        view.addSubview(chrome)\n        configureBottomChrome()\n\n        let stack = chrome.contentView.subviews.first!'''
          if old not in text:
              raise SystemExit('Swift safe-area patch target not found')
          swift.write_text(text.replace(old, new, 1))

          java = Path('plugins/criblo-native-browser/android/src/main/java/com/criblo/nativebrowser/CRIBrowserPlugin.java')
          text = java.read_text()
          old = '''        String requested = call.getString("url", PINNED_ORANGE_URL);\n        boolean resumeLast = Boolean.TRUE.equals(call.getBoolean("resumeLast", false));'''
          new = '''        String requested = call.getString("url");\n        if (requested == null) requested = PINNED_ORANGE_URL;\n        Boolean resumeValue = call.getBoolean("resumeLast");\n        boolean resumeLast = resumeValue != null && resumeValue;'''
          if old not in text:
              raise SystemExit('Android PluginCall patch target not found')
          java.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-native-browser-followup.yml
          git add plugins/criblo-native-browser/ios/Sources/CRIBrowserPlugin/CRIBrowserPlugin.swift
          git add plugins/criblo-native-browser/android/src/main/java/com/criblo/nativebrowser/CRIBrowserPlugin.java
          git commit -m "Fix native browser safe-area setup"
          git push origin HEAD:criblo-master-spec-v1
