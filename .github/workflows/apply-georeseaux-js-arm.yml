name: Apply GeoReseaux trusted-tail hold fix

on:
  push:
    branches:
      - criblo-master-spec-v1
    paths:
      - scripts/patch-georeseaux-js-arm.mjs
      - .github/workflows/apply-georeseaux-js-arm.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: criblo-master-spec-v1

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: criblo-master-spec-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply trusted touch arm state machine
        run: |
          set -euxo pipefail
          node scripts/patch-georeseaux-js-arm.mjs
          rm -f scripts/patch-georeseaux-js-arm.mjs
          rm -f .github/workflows/apply-georeseaux-js-arm.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Arm GeoReseaux hold from trusted touch on iOS"
          git push origin HEAD:${TARGET_BRANCH}
