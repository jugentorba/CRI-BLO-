// Add to android/app/build.gradle

android {
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'com.capacitorjs:core:5.5.0'
    implementation 'com.capacitorjs:camera:5.5.0'
    implementation 'com.capacitorjs:geolocation:5.5.0'
    implementation 'com.capacitorjs:storage:5.5.0'
    implementation 'com.capacitorjs:network:5.5.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
}